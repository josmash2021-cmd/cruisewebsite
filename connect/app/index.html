<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060503">
  <meta name="robots" content="noindex">
  <title>Get the CRUISE App</title>
  <link rel="icon" type="image/png" href="../logo-carrito.png">

  <!-- Smart redirect: Android → Google Play · iPhone/iPad → App Store · resto → /connect/ -->
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var url = null;
      if (/android/i.test(ua)) {
        url = 'https://play.google.com/store/apps/details?id=com.cruiseinride.app';
      } else if (/iPad|iPhone|iPod/.test(ua) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) { /* iPadOS reporta como Mac */
        url = 'https://apps.apple.com/us/app/cruise-in-ride/id6760517086';
      }
      /* location.replace: el QR no deja esta página en el historial */
      location.replace(url || '../');
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060503; color: #f5f0e8;
      font-family: 'Cinzel', Georgia, serif;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px; padding: 40px 20px; text-align: center;
    }
    img.logo { width: 220px; max-width: 70vw; height: auto;
      filter: drop-shadow(0 0 18px rgba(212,175,55,0.35)); }
    h1 { font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(245,240,232,0.55); font-weight: 400; }
    .stores { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
    .stores a {
      display: block; padding: 16px;
      border: 1px solid rgba(212,175,55,0.3); border-radius: 16px;
      background: rgba(255,255,255,0.035);
      color: #f5f0e8; text-decoration: none;
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      transition: border-color .3s, background .3s;
    }
    .stores a:hover { border-color: rgba(212,175,55,0.6); background: rgba(212,175,55,0.08); }
    .stores a span { display: block; margin-top: 4px; font-size: 9px;
      letter-spacing: 1px; color: rgba(245,240,232,0.4); }
  </style>
</head>
<body>
  <!-- Solo se ve si el JS no corre: ambas tiendas como fallback -->
  <img class="logo" src="../cruise-logo.png" alt="CRUISE">
  <h1>Get the App</h1>
  <div class="stores">
    <a href="https://play.google.com/store/apps/details?id=com.cruiseinride.app">
      Google Play <span>Android</span>
    </a>
    <a href="https://apps.apple.com/us/app/cruise-in-ride/id6760517086">
      App Store <span>iPhone</span>
    </a>
  </div>
</body>
</html>
