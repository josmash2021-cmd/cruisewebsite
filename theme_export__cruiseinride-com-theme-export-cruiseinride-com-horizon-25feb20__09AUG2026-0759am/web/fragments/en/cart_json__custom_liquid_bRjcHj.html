<style>
:root{
  --gold:#c9a23a;
}

/* SECTION */
.contactX{
  position:relative;
  min-height:95vh;
  padding:100px 16px;
  color:white;
  overflow:hidden;
  font-family:"Inter",sans-serif;
}

/* Background */
.contactX__bg{
  position:absolute;
  inset:0;
  z-index:-2;
  background:#000;
}
.contactX__video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.contactX__overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(to bottom,rgba(0,0,0,1) 0%,rgba(0,0,0,.6) 25%,transparent 45%),
    linear-gradient(to top,rgba(0,0,0,1) 0%,rgba(0,0,0,.7) 25%,transparent 55%),
    radial-gradient(circle at 50% 18%,rgba(201,162,58,.14),transparent 62%);
}

/* Layout */
.contactX__wrap{
  max-width:1100px;
  margin:auto;
  text-align:center;
}
.contactX__kicker{
  letter-spacing:.4em;
  font-size:12px;
  color:var(--gold);
}
.contactX__title{
  font-family:"Cinzel",serif;
  font-size:clamp(34px,8vw,70px);
}
.contactX__accent{
  color:var(--gold);
}

/* Grid */
.contactX__grid{
  display:grid;
  grid-template-columns:1fr 1.3fr;
  gap:40px;
}
@media(max-width:980px){
  .contactX__grid{grid-template-columns:1fr;}
}

/* Cards */
.contactX__cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
@media(max-width:520px){
  .contactX__cards{grid-template-columns:1fr;}
}

.contactX__card{
  background:rgba(20,22,25,.55);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:16px;
  padding:26px 20px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.65);
}
.contactX__card--wide{
  grid-column:1/-1;
}
@media(max-width:520px){
  .contactX__card--wide{grid-column:auto;}
}

.contactX__icon{
  width:60px;height:60px;
  margin:0 auto 14px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--gold);
  color:black;
  font-size:22px;
}

.contactX__icon--outline{
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
}

.contactX__icon--circle{
  border-radius:999px;
  border:1px solid var(--gold);
  background:rgba(0,0,0,.15);
  color:var(--gold);
}

.contactX__cardTitle{
  font-family:"Cinzel";
  font-size:17px;
  margin-bottom:6px;
}
.contactX__cardText{
  opacity:.75;
  font-size:14px;
}

/* Panel */
.contactX__panel{
  background:rgba(20,22,25,.55);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:16px;
  padding:26px;
  text-align:center;
  box-shadow:0 26px 70px rgba(0,0,0,.7);
}
.contactX__panelTitle{
  font-family:"Cinzel";
  margin-bottom:18px;
  font-size:20px;
}

/* FORM */
.contactX__form{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.contactX__row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
@media(max-width:600px){
  .contactX__row{grid-template-columns:1fr;}
}

.contactX__input,
.contactX__textarea{
  background:#ffffff !important;
  border:1px solid rgba(0,0,0,.15) !important;
  padding:14px;
  border-radius:10px;
  color:#000 !important;
  font-weight:500;
  outline:none;
}

.contactX__input::placeholder,
.contactX__textarea::placeholder{
  color:rgba(0,0,0,.45);
}

.contactX__input:focus,
.contactX__textarea:focus{
  border:1px solid var(--gold) !important;
}

.contactX__btn{
  background:var(--gold);
  color:black;
  height:54px;
  border-radius:12px;
  font-weight:800;
  letter-spacing:.2em;
  cursor:pointer;
  border:none;
  transition:.25s;
}
.contactX__btn:hover{
  transform:translateY(-3px);
}
