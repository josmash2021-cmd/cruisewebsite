<style>
:root{
  --gold:#c9a23a;
  --gold-light:#f5d77a;
  --gold-dark:#b98d1c;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-back:cubic-bezier(.34,1.56,.64,1);
  --tSlow:2400ms;
  --tMed:1700ms;
}

/* Fondo negro en el wrapper de Shopify */
#shopify-section-collection_json__custom_liquid_yxmknE{
  background:#000 !important;
}

.contactX{
  position:relative;
  isolation:isolate;
  z-index:1;
  min-height:95vh;
  padding:120px 16px;
  margin-top:0;
  margin-bottom:0;
  color:white;
  overflow:visible;
  box-shadow:
    0 -60px 40px -10px #000;
  font-family:"Inter",sans-serif;
}

/* GRADIENT BLEND — 300px de alto, negro solido largo */
.contactX::before,
.contactX::after{
  content:'';
  position:absolute;
  left:0;
  right:0;
  height:150px;
  z-index:3;
  pointer-events:none;
}
.contactX::before{
  top:-80px;
  background:linear-gradient(to bottom,
    #000 0%,
    #000 40%,
    rgba(0,0,0,.6) 70%,
    transparent 100%
  );
}
.contactX::after{
  bottom:0;
  background:linear-gradient(to top,
    #000 0%,
    rgba(0,0,0,.6) 40%,
    rgba(0,0,0,.3) 70%,
    transparent 100%
  );
}

.contactX__bg{
  position:absolute;
  inset:0;
  z-index:-1;
  background:#000;
  overflow:hidden;
}

.contactX__video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.02);
  filter:contrast(1.2) saturate(1.15) brightness(1.08);
  image-rendering:-webkit-optimize-contrast;
  image-rendering:crisp-edges;
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
  backface-visibility:hidden;
  will-change:transform;
}

.contactX__overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.85) 0%,rgba(0,0,0,.4) 20%,transparent 45%),
    linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 20%,transparent 50%),
    radial-gradient(circle at 50% 18%,rgba(201,162,58,.14),transparent 62%);
}

.contactX__sharpen{
  position:absolute;
  inset:0;
  backdrop-filter:contrast(1.1) saturate(1.05);
  pointer-events:none;
  opacity:0.3;
}

.contactX__vignette{
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.4) 100%);
  pointer-events:none;
}

.contactX__wrap{
  max-width:1100px;
  margin:auto;
  text-align:center;
  position:relative;
  z-index:2;
}

.contactX__head{
  margin-bottom:50px;
}
.contactX__kicker{
  letter-spacing:.45em;
  font-size:12px;
  color:var(--gold);
  font-weight:600;
  margin-bottom:15px;
  display:inline-block;
  padding:8px 16px;
  border:1px solid rgba(201,162,58,.3);
  border-radius:50px;
  background:rgba(201,162,58,.1);
  backdrop-filter:blur(10px);
}
.contactX__title{
  font-family:"Cinzel",serif;
  font-size:clamp(34px,8vw,70px);
  margin:0;
  line-height:1.1;
}
.contactX__accent{
  color:var(--gold);
  position:relative;
  display:inline-block;
}
.contactX__accent::after{
  content:'';
  position:absolute;
  bottom:-5px;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  border-radius:3px;
}

.contactX__divider{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  margin-top:25px;
}
.contactX__divider span:first-child,
.contactX__divider span:last-child{
  width:80px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}
.contactX__divider span:nth-child(2){
  color:var(--gold);
  font-size:12px;
  animation:diamondRotate 4s linear infinite;
}

@keyframes diamondRotate{
  0%{ transform:rotate(0deg); }
  100%{ transform:rotate(360deg); }
}

.contactX__grid{
  display:grid;
  grid-template-columns:1fr 1.3fr;
  gap:40px;
  align-items:start;
}
@media(max-width:980px){
  .contactX__grid{grid-template-columns:1fr;}
}

.contactX__cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
@media(max-width:520px){
  .contactX__cards{grid-template-columns:1fr;}
}

.contactX__card{
  position:relative;
  background:rgba(20,22,25,.55);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:20px;
  padding:30px 22px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.65);
  overflow:hidden;
  transition:
    transform var(--tMed) var(--ease),
    border-color var(--tMed) var(--ease),
    box-shadow var(--tMed) var(--ease);
  will-change:transform;
}

.contactX__card-glow{
  position:absolute;
  inset:-2px;
  background:radial-gradient(ellipse at center, rgba(201,162,58,.3) 0%, transparent 70%);
  opacity:0;
  filter:blur(20px);
  z-index:-1;
  transition:opacity var(--tMed) ease;
}

.contactX__card:hover{
  transform:translateY(-8px);
  border-color:rgba(201,162,58,.4);
  box-shadow:
    0 30px 85px rgba(0,0,0,.70),
    0 0 0 2px rgba(201,162,58,.12),
    0 0 40px rgba(201,162,58,.15);
}

.contactX__card:hover .contactX__card-glow{
  opacity:1;
}

.contactX__card--wide{ grid-column:1/-1; }

.contactX__icon{
  width:60px;
  height:60px;
  margin:0 auto 16px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--gold);
  color:black;
  font-size:22px;
  transition:transform var(--tMed) var(--ease-back), box-shadow var(--tMed) ease;
  box-shadow:0 10px 30px rgba(201,162,58,.2);
}

.contactX__icon--outline{
  background:transparent;
  border:2px solid var(--gold);
  color:var(--gold);
}

.contactX__icon--circle{
  border-radius:999px;
  border:2px solid var(--gold);
  background:rgba(0,0,0,.15);
  color:var(--gold);
}

.contactX__card:hover .contactX__icon{
  transform:scale(1.1) rotate(5deg);
  box-shadow:0 15px 40px rgba(201,162,58,.3);
}

.contactX__cardTitle{
  font-family:"Cinzel";
  font-size:18px;
  font-weight:600;
  margin-bottom:8px;
  color:#fff;
}
.contactX__cardText{
  opacity:.85;
  font-size:14px;
  font-weight:500;
}
.contactX__cardText a{
  color:inherit;
  text-decoration:none;
  transition:color 0.3s ease;
}
.contactX__cardText a:hover{
  color:var(--gold);
}
.contactX__cardText--highlight{
  font-size:28px;
  font-weight:700;
  color:var(--gold);
  text-shadow:0 0 20px rgba(201,162,58,.3);
}
.contactX__card-subtext{
  font-size:12px;
  opacity:.6;
  margin-top:5px;
}

.contactX__card-action{
  margin-top:15px;
}
.contactX__whatsapp,
.contactX__copy{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  border-radius:25px;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.05em;
  text-transform:uppercase;
  text-decoration:none;
  transition:all 0.3s ease;
  cursor:pointer;
  border:none;
}

.contactX__whatsapp{
  background:#25D366;
  color:white;
}
.contactX__whatsapp:hover{
  background:#128C7E;
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(37,211,102,.3);
}

.contactX__copy{
  background:rgba(201,162,58,.2);
  color:var(--gold);
  border:1px solid rgba(201,162,58,.4);
}
.contactX__copy:hover{
  background:rgba(201,162,58,.3);
  border-color:var(--gold);
}

.contactX__panel{
  position:relative;
  background:rgba(20,22,25,.55);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:20px;
  padding:35px;
  text-align:left;
  box-shadow:0 26px 70px rgba(0,0,0,.7);
  overflow:hidden;
  transition:
    transform var(--tMed) var(--ease),
    border-color var(--tMed) var(--ease),
    box-shadow var(--tMed) var(--ease);
}

.contactX__panel:hover{
  transform:translateY(-4px);
  border-color:rgba(201,162,58,.3);
  box-shadow:
    0 34px 95px rgba(0,0,0,.75),
    0 0 0 2px rgba(201,162,58,.10),
    0 0 40px rgba(201,162,58,.10);
}

.contactX__panel-glow{
  position:absolute;
  inset:-2px;
  background:radial-gradient(ellipse at top, rgba(201,162,58,.2) 0%, transparent 60%);
  opacity:0.5;
  filter:blur(30px);
  z-index:-1;
}

.contactX__panelTitle{
  font-family:"Cinzel";
  margin-bottom:25px;
  font-size:22px;
  font-weight:600;
  color:#fff;
  text-align:center;
  position:relative;
}
.contactX__panelTitle::after{
  content:'';
  position:absolute;
  bottom:-10px;
  left:50%;
  transform:translateX(-50%);
  width:60px;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

.contactX__form{
  display:flex;
  flex-direction:column;
  gap:20px;
}
.contactX__row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
@media(max-width:600px){
  .contactX__row{grid-template-columns:1fr;}
}

.contactX__field{
  position:relative;
}

.contactX__input,
.contactX__textarea,
.contactX .contactX__textarea,
.contactX .contactX__input,
.contactX input[type="text"],
.contactX input[type="email"],
.contactX textarea{
  width:100%;
  background:rgba(0,0,0,.4) !important;
  background-color:rgba(0,0,0,.4) !important;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.2) !important;
  padding:16px;
  border-radius:12px;
  color:var(--gold) !important;
  font-weight:500;
  font-size:15px;
  font-family:"Inter",sans-serif;
  outline:none !important;
  transition:all 0.3s ease;
  -webkit-appearance:none;
  appearance:none;
  box-sizing:border-box;
}

.contactX__input:focus,
.contactX__textarea:focus,
.contactX input:focus,
.contactX textarea:focus{
  border-color:var(--gold) !important;
  box-shadow:0 0 0 4px rgba(201,162,58,.15), 0 8px 25px rgba(0,0,0,.2);
  background:rgba(0,0,0,.5) !important;
  background-color:rgba(0,0,0,.5) !important;
}

.contactX__input::placeholder,
.contactX__textarea::placeholder,
.contactX input::placeholder,
.contactX textarea::placeholder{

.contactX__label{
  position:absolute;

  font-size:11px;
  font-weight:700;
  padding:3px 10px;
  border-radius:20px;
  opacity:0;
  transform:translateY(5px);
  transition:all 0.3s ease;
  pointer-events:none;
  text-transform:uppercase;
  letter-spacing:0.05em;
}

.contactX__input:focus + .contactX__label,
.contactX__textarea:focus + .contactX__label,
.contactX__input:not(:placeholder-shown) + .contactX__label,
.contactX__textarea:not(:placeholder-shown) + .contactX__label{
  opacity:1;
  transform:translateY(0);
}

.contactX__textarea{
  min-height:120px;
  resize:vertical;
}

.contactX__btn{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
  color:black;
  height:56px;
  border-radius:14px;
  font-weight:800;
  letter-spacing:.15em;
  cursor:pointer;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;

    transform var(--tSlow) var(--ease),

.contactX__btn-text{

.contactX__btn-icon{

  z-index:2;

}

.contactX__btn-shine{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.4) 50%, transparent 100%);
  transform:translateX(-100%);
  transition:transform 0.8s ease;
}

.contactX__btn:hover{

    0 25px 60px rgba(201,162,58,.4),
    0 0 0 2px rgba(201,162,58,.2);
}

.contactX__btn:hover .contactX__btn-shine{
  transform:translateX(100%);
}

.contactX__btn:hover .contactX__btn-icon{
  transform:translateX(5px);
}

.contactX__btn:active{
  transform:translateY(-1px) scale(.985);
}

/* ANIMACIONES */
.contactX__head,
.contactX__cards,
.contactX__panel{
  opacity:0;
  transform:translateY(18px) scale(.985);
  filter:blur(10px);
  transition:
    opacity var(--tSlow) var(--ease),
    transform var(--tSlow) var(--ease),
    filter var(--tSlow) var(--ease);
  will-change:opacity, transform, filter;
}

.contactX__head{ transition-delay:120ms; }
.contactX__cards{ transition-delay:320ms; }
.contactX__panel{ transition-delay:520ms; }

.contactX.is-visible .contactX__head,
.contactX.is-visible .contactX__cards,
.contactX.is-visible .contactX__panel{
  opacity:1;
  transform:translateY(0) scale(1);
  filter:blur(0);
}

.contactX__card[data-animate="card-up"]{
  opacity:0;

<script>
